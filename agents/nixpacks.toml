[phases.setup]
nixPkgs = ["python313"]

[phases.install]
cmds = [
  "python3.13 -m ensurepip --upgrade",
  "python3.13 -m pip install -r requirements.txt",
  "python3.13 -c \"import urllib.request as u; base='https://raw.githubusercontent.com/ankush30619-jpg/performedge-socialos/master/agents/'; [open(f,'wb').write(u.urlopen(base+f).read()) for f in ['state.py','pipeline.py']]; print('[nixpacks] Patched state.py and pipeline.py from master')\""
]

[start]
cmd = "python3.13 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
