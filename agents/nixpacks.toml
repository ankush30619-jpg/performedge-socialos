[phases.setup]
nixPkgs = ["python313"]

[phases.install]
cmds = [
  "python3.13 -m venv /opt/venv",
  "/opt/venv/bin/pip install -r requirements.txt",
  "/opt/venv/bin/python3.13 -c \"import urllib.request as u; base='https://raw.githubusercontent.com/ankush30619-jpg/performedge-socialos/master/agents/'; [open(f,'wb').write(u.urlopen(base+f).read()) for f in ['state.py','pipeline.py']]; print('[nixpacks] Patched state.py and pipeline.py from master')\""
]

[start]
cmd = "/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT"
